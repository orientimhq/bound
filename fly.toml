# Orientim on Fly.io: one machine, behind Cloudflare (docs/FLY.md).
# Deploy: tools/fly-deploy.sh (fly deploy --build-arg ORIENTIM_BUILD_ID=<the clean commit>)
# Secrets (fly secrets set, never here): RPC_URL, RPC_URL_FALLBACK, JUPITER_API_KEY, ORIENTIM_API_SECRET,
# ORIENTIM_API_KEYS, ORIENTIM_KEY_SECRET, ORIENTIM_ORIGIN_SECRET, TUNNEL_TOKEN.

app = "orientim"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

  # Public, compiled into the page: the same values as the release build (release.yml).
  [build.args]
    NEXT_PUBLIC_ORIENTIM_TREASURY = "ARzSA3sZGhf5t4UnYrmB3TWyZ5m3Wo1nA9zWBcoiTqLE"
    NEXT_PUBLIC_ORIENTIM_FEE_BPS = "25"

# One machine, updated in place: the old process stops before the new one starts, so there are never
# two. Tickets prepared before a restart are refused (server-restarted) and prepared again; the output
# accounts held for swaps already sent stay held until those land or expire (ORIENTIM_STATE_DIR).
[deploy]
  strategy = "rolling"
  max_unavailable = 1

[env]
  ORIENTIM_ENV = "production"
  ORIENTIM_SINGLE_INSTANCE = "1"
  ORIENTIM_CLIENT_IP_HEADER = "cf-connecting-ip"
  ORIENTIM_PUBLIC_ORIGIN = "https://orientim.com"
  ORIENTIM_TERMS_DIR = "/data"
  # The output accounts held for swaps in flight, kept across a restart (shared.ts); without it finalize signs nothing.
  ORIENTIM_STATE_DIR = "/data"
  # Swaps on an active Pump.fun curve built from the chain, without asking Jupiter (docs/FLY.md).
  ORIENTIM_LOCAL_CURVE = "1"
  # The Jupiter plan's requests a minute: 60 Free (unset), 600 Developer, 3000 Launch (jupiterGate.ts).
  # Developer: JUPITER_API_KEY must be that plan's key, or Jupiter answers 429 past 60.
  ORIENTIM_JUPITER_PER_MINUTE = "600"
  # Well under the machine's 4 GB, so that V8 collects before the machine runs out (the process uses a few hundred MB).
  NODE_OPTIONS = "--max-old-space-size=2048"

# The Terms each key accepted, one file each (ORIENTIM_TERMS_DIR). Take a volume snapshot daily (Fly does by default).
[[mounts]]
  source = "orientim_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  # A machine that stopped (a crash) is started again by the next request.
  auto_start_machines = true
  min_machines_running = 1

  # About what one vCPU builds within a prepare's 45 seconds: past it Fly refuses at its edge,
  # rather than queue requests that would run out of time after spending the RPC's and Jupiter's quota.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 25
    hard_limit = 50

  # The one path answered without Cloudflare's header (proxy.ts): it only says the process is up.
  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/api/live"

[[vm]]
  size = "performance-1x"
  memory = "4gb"
