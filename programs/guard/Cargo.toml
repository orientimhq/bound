[package]
name = "orientim-guard"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Orientim Guard: an agent trades from the owner's token accounts only with Orientim's co-signature and within the owner's on-chain limits"

[dependencies]
solana-program = "4"

[lib]
crate-type = ["cdylib", "lib"]

[profile.release]
overflow-checks = true
