# Orientim's verifier on Fly. Secrets (set with `fly secrets set`, never in this file):
# VERIFIER_KEY, RPC_URL. Deploy from the repository root, which is the image's build context:
#   fly deploy . -c verifier/fly.toml --dockerfile verifier/Dockerfile
# (the flag names the Dockerfile from the repository root, so no path here depends on how flyctl reads it).
# Each machine keeps its own rate per agent: with two machines an agent can have up to twice the rate.
app = 'orientim-verifier'
primary_region = 'fra'

[env]
  GUARD_PROGRAM = '11111111111111111111111111111111' # the Guard's address, once it is deployed
  VERIFIER_PER_MINUTE = '30'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  min_machines_running = 2

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    method = 'GET'
    path = '/health'
