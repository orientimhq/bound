name: Release

# A tag v* publishes the digest of what the browser loads for that commit, with the public build
# settings compiled into it, so the live site can be checked against it (live-check.yml) and
# anyone with the source can rebuild and compare (docs/OPERATORS.md, "Verifying the code you are running").
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # The same values the production build uses; they are compiled into the page and so into
      # the digest. Set them as repository variables (Settings → Secrets and variables → Actions).
      NEXT_PUBLIC_ORIENTIM_TREASURY: ${{ vars.NEXT_PUBLIC_ORIENTIM_TREASURY }}
      NEXT_PUBLIC_ORIENTIM_FEE_BPS: ${{ vars.NEXT_PUBLIC_ORIENTIM_FEE_BPS || '25' }}
      NEXT_PUBLIC_ORIENTIM_ENABLE_V1: ${{ vars.NEXT_PUBLIC_ORIENTIM_ENABLE_V1 }}
      NEXT_PUBLIC_ORIENTIM_FEE_TIER_BPS: ${{ vars.NEXT_PUBLIC_ORIENTIM_FEE_TIER_BPS }}
      NEXT_PUBLIC_ORIENTIM_FEE_TIER_SOL: ${{ vars.NEXT_PUBLIC_ORIENTIM_FEE_TIER_SOL }}
    steps:
      # A digest for a page with no treasury is one production never serves: stop rather than publish it.
      - run: test -n "$NEXT_PUBLIC_ORIENTIM_TREASURY" || { echo 'The repository variable NEXT_PUBLIC_ORIENTIM_TREASURY is not set.'; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # No cache where a release is built and signed: only the lockfile's hashes decide what is installed.
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      # Nothing is published that has not passed the tests: a digest
      # says which code runs, not that it was tested.
      - run: npm run typecheck
      - run: npm test
      - run: ORIENTIM_BUILD_ID=$GITHUB_SHA npm run build
      - run: npm run build:digest
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          digest=$(sed -n 's/^digest: //p' apps/web/.next/build-digest.txt)
          cat > notes.md <<EOF
          Build digest: \`$digest\`

          Everything the browser loads from \`/_next/static\`, hashed file by file in \`build-digest.txt\`.
          The live site is checked against it on a schedule (\`live-check.yml\`).

          Rebuild and compare (Node 24):

          \`\`\`
          git checkout $GITHUB_REF_NAME
          npm ci --ignore-scripts
          NEXT_PUBLIC_ORIENTIM_TREASURY=$NEXT_PUBLIC_ORIENTIM_TREASURY NEXT_PUBLIC_ORIENTIM_FEE_BPS=$NEXT_PUBLIC_ORIENTIM_FEE_BPS NEXT_PUBLIC_ORIENTIM_ENABLE_V1=$NEXT_PUBLIC_ORIENTIM_ENABLE_V1 NEXT_PUBLIC_ORIENTIM_FEE_TIER_BPS=$NEXT_PUBLIC_ORIENTIM_FEE_TIER_BPS NEXT_PUBLIC_ORIENTIM_FEE_TIER_SOL=$NEXT_PUBLIC_ORIENTIM_FEE_TIER_SOL ORIENTIM_BUILD_ID=$GITHUB_SHA npm run build
          node tools/build-digest.ts
          \`\`\`
          EOF
          gh release create "$GITHUB_REF_NAME" apps/web/.next/build-digest.txt \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          echo "digest=$digest" >> "$GITHUB_STEP_SUMMARY"
