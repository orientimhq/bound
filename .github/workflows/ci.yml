name: CI

# The tests run on each change to the code; a change only to the docs runs nothing. AGENT-API.md is
# not a doc here: @orientimhq/swap carries a copy of it, which the tests check. The reproducible
# build (three full builds) runs on a release tag and by hand, not on every push: on a private
# repository each billed minute counts against the plan.
on:
  push:
    paths-ignore: ['README.md', 'SECURITY.md', 'docs/**']
  pull_request:
    paths-ignore: ['README.md', 'SECURITY.md', 'docs/**']
  workflow_dispatch:

# Read only: no step here publishes or writes, and install scripts never run.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      # Ultracite's rules as a check only: it reads the code and rewrites nothing (biome.jsonc).
      - run: npm run lint
      - run: npm test
      - run: npm run build

  package:
    # @orientimhq/swap, as package-lock.json pins it, is what its public repository's release
    # workflow published: npm's provenance names that repository, the workflow and the commit. The
    # server and the agents it serves run the same verifier only while this holds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit signatures

  reproducible:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    # The digest of the built client assets is what a user can check against the audited source,
    # and it is worth nothing unless the same source always produces the same bytes.
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.twice.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build twice and compare
        id: twice
        run: |
          ORIENTIM_BUILD_ID=$GITHUB_SHA npm run build
          first=$(node tools/build-digest.ts)
          rm -rf apps/web/.next
          ORIENTIM_BUILD_ID=$GITHUB_SHA npm run build
          second=$(node tools/build-digest.ts)
          echo "first  $first"
          echo "second $second"
          test "$first" = "$second"
          echo "digest=$first" >> "$GITHUB_STEP_SUMMARY"
          echo "digest=$first" >> "$GITHUB_OUTPUT"

  reproducible-elsewhere:
    # The same build on another runner image must give the same digest: two builds
    # on one machine agree even when that machine is what changed them.
    needs: reproducible
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build once and compare with the other image
        run: |
          ORIENTIM_BUILD_ID=$GITHUB_SHA npm run build
          here=$(node tools/build-digest.ts)
          echo "ubuntu-latest ${{ needs.reproducible.outputs.digest }}"
          echo "ubuntu-22.04  $here"
          test "$here" = "${{ needs.reproducible.outputs.digest }}"
