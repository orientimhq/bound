name: MCP live

# The MCP server as a customer installs it (npx -y orientim-mcp@<version>, or the skill's own file), on
# Linux, macOS and Windows, against orientim.com, mainnet and Jupiter: tools/mcp/live.mjs. Without a
# test wallet: the protocol, balances on the RPC, Orientim's key message signed and answered, refused
# input. With the secret TEST_WALLET_KEYPAIR (a solana-keygen file of a wallet kept only for these tests, holding
# 0.02 SOL or more): quotes of majors, memecoins, an LST and a Token-2022 token, and the owner's
# limits, nothing signed. swaps set to 1 also swaps for real on each system, 0.002 SOL to USDC and
# back; full also, on Linux, buys and sells back every kind of token the skill takes (a stablecoin, a
# DeFi token, memecoins, an LST, a Token-2022 token, one token for another). Then through the skill's
# two other ways in (tools/live-channels.mjs): the agent's command line and orientim-verify, each fee
# side, an order run again, recover, and tools/pilot-report.ts on the chain. A few cents of fees from the test wallet in all. The report is each job's summary.
#
# By hand only. It uses CANARY_RPC_URL and CANARY_JUPITER_API_KEY, the canary's keys apart from
# production's. One system at a time: the wallet's swaps never overlap.
on:
  workflow_dispatch:
    inputs:
      source:
        description: 'npm: the published package, as customers run it; repo: the skill''s bin/orientim-mcp.mjs at this commit'
        required: false
        default: 'npm'
      version:
        description: 'With source npm: the version (empty: the skill''s, in skills/orientim-protected-swap/package.json)'
        required: false
        default: ''
      swaps:
        description: '1: also swap for real from the test wallet (0.002 SOL to USDC and back, on each system); full: and on Linux every kind of token, each bought and sold back'
        required: false
        default: '0'

permissions:
  contents: read

concurrency:
  group: mcp-live
  cancel-in-progress: false

jobs:
  live:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: The server's command
        id: server
        env:
          SOURCE: ${{ inputs.source }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$SOURCE" = repo ]; then
            (cd skills/orientim-protected-swap && npm ci --ignore-scripts)
            echo "command=node skills/orientim-protected-swap/bin/orientim-mcp.mjs" >> "$GITHUB_OUTPUT"
          else
            v="${VERSION:-$(node -p "require('./skills/orientim-protected-swap/package.json').version")}"
            [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a version: $v"; exit 2; }
            echo "command=npx -y orientim-mcp@$v" >> "$GITHUB_OUTPUT"
          fi
      - name: The test wallet
        env:
          KEYPAIR: ${{ secrets.TEST_WALLET_KEYPAIR }}
        run: |
          if [ -n "$KEYPAIR" ]; then
            umask 077
            printf '%s' "$KEYPAIR" > "$RUNNER_TEMP/test-wallet.json"
            echo "LIVE_WALLET_KEYPAIR=$RUNNER_TEMP/test-wallet.json" >> "$GITHUB_ENV"
          fi
      - name: Live
        env:
          SOLANA_RPC_URL: ${{ secrets.CANARY_RPC_URL }}
          JUPITER_API_KEY: ${{ secrets.CANARY_JUPITER_API_KEY }}
          # The whole token list once, on Linux; the other systems swap SOL to USDC and back.
          LIVE_SWAPS: ${{ inputs.swaps == 'full' && matrix.os != 'ubuntu-latest' && '1' || inputs.swaps }}
        run: node tools/mcp/live.mjs ${{ steps.server.outputs.command }}
      - name: Forget the test wallet
        if: always()
        run: rm -f "$RUNNER_TEMP/test-wallet.json"

  channels:
    # After the MCP server's swaps, whatever they found: the same wallet, never two at once.
    if: ${{ !cancelled() && (inputs.swaps == '1' || inputs.swaps == 'full') }}
    needs: live
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --ignore-scripts
        working-directory: skills/orientim-protected-swap
      - name: The test wallet
        env:
          KEYPAIR: ${{ secrets.TEST_WALLET_KEYPAIR }}
        run: |
          [ -n "$KEYPAIR" ] || { echo "::error::Add the secret TEST_WALLET_KEYPAIR first."; exit 1; }
          umask 077
          printf '%s' "$KEYPAIR" > "$RUNNER_TEMP/test-wallet.json"
      - name: The agent and the bot, for real
        env:
          SOLANA_RPC_URL: ${{ secrets.CANARY_RPC_URL }}
          JUPITER_API_KEY: ${{ secrets.CANARY_JUPITER_API_KEY }}
          LIVE_WALLET_KEYPAIR: ${{ runner.temp }}/test-wallet.json
          LIVE_OUT: ${{ runner.temp }}/channels
        run: node tools/live-channels.mjs
      - name: Forget the test wallet
        if: always()
        run: rm -f "$RUNNER_TEMP/test-wallet.json"
