name: CPI

# T6: build the malicious swap program and run it against Orientim's protected transaction inside a
# real Solana VM. Separate from CI because it needs the Rust and Solana toolchains.
on:
  # When what T6 exercises changes (the transaction it builds, the verifier, its dependencies), on main
  # and in pull requests; by hand otherwise. Running it on every push to main would cost more minutes
  # than a private repository's plan affords.
  push:
    branches: [main]
    paths:
      - 'tests/cpi/**'
      - 'packages/core/**'
      - 'packages/verifier/**'
      - 'package-lock.json'
      - '.github/workflows/cpi.yml'
  pull_request:
    paths:
      - 'tests/cpi/**'
      - 'packages/core/**'
      - 'packages/verifier/**'
      - 'package-lock.json'
      - '.github/workflows/cpi.yml'
  workflow_dispatch:

jobs:
  cpi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The lockfile is written on Windows, where litesvm has no binary; make sure the Linux one is here.
      - run: npm install --no-save litesvm@1.4.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 23 September 2026
      - name: Install the Solana toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - run: solana --version

      - name: Cache the SBF platform tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/solana
          key: platform-tools-${{ runner.os }}

      - name: Build the malicious program
        working-directory: tests/cpi/attacker
        run: cargo build-sbf

      - name: Run T6
        run: node tests/cpi/run.ts

      # The same program with random plans, amounts and decimals; the Fuzz workflow runs it by the hundred thousand.
      - name: Fuzz T6
        env:
          ORIENTIM_FUZZ_RUNS: 1000
        run: ORIENTIM_FUZZ_SEED=$GITHUB_RUN_NUMBER node tests/cpi/fuzz.ts

      - name: The report
        if: always()
        run: cat tests/cpi/results/cpi.md tests/cpi/results/cpi-fuzz.md || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cpi-report
          path: tests/cpi/results/
          if-no-files-found: ignore
