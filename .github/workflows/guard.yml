name: Guard

# Orientim Guard (programs/guard): typecheck and lint the tests, build the program and the malicious
# swap program the tests use as the route, run the program's own unit tests, every fixed case of
# tests/guard/run.ts and the fuzzer tests/guard/fuzz.ts inside a real Solana VM (litesvm), then build
# two deliberately broken copies of the program and require the fuzzer to catch each.
on:
  push:
    branches: [main, guard-poc]
  pull_request:
  workflow_dispatch:

# Read only: no step here publishes or writes, and install scripts never run.
permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # The lockfile is written on Windows, where litesvm has no binary; make sure the Linux one is here.
      - run: npm install --no-save --ignore-scripts litesvm@1.4.1
      - run: npm run typecheck
      - run: npm run lint

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 23 September 2026
      - name: Install the Solana toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - id: solana
        run: |
          solana --version
          echo "version=$(solana --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache the SBF platform tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/solana
          key: platform-tools-${{ runner.os }}-${{ steps.solana.outputs.version }}

      - name: The program's unit tests
        working-directory: programs/guard
        run: cargo test --locked

      - name: Build the Guard
        working-directory: programs/guard
        run: cargo build-sbf -- --locked
      - name: Build the malicious swap program
        working-directory: tests/guard/attacker
        run: cargo build-sbf

      - name: The fixed cases
        run: node tests/guard/run.ts
      - name: The fuzzer
        env:
          GUARD_FUZZ_RUNS: 1000
          GUARD_FUZZ_SEED: ${{ github.run_number }}
        run: node tests/guard/fuzz.ts

      # A fuzzer that passes on a broken program proves nothing. M1 drops the minimum check of Settle
      # (I4); M2 drops the check that the output account is the owner's (I2). Each copy must make the
      # fuzzer fail (exit 1, a broken promise), with a fixed seed so the result is repeatable.
      - name: Two broken copies the fuzzer must catch
        run: |
          mutant() {
            dir="$RUNNER_TEMP/$1"
            rm -rf "$dir" && mkdir -p "$dir" && cp -r programs/guard/Cargo.toml programs/guard/Cargo.lock programs/guard/src "$dir/"
            python3 - "$dir/src/lib.rs" "$2" "$3" <<'PY'
          import sys
          path, old, new = sys.argv[1:]
          text = open(path).read()
          assert text.count(old) == 1, f"the mutant's target is not in the program exactly once: {old}"
          open(path, "w").write(text.replace(old, new))
          PY
            (cd "$dir" && cargo build-sbf -- --locked)
            set +e
            GUARD_SO="$dir/target/deploy/orientim_guard.so" GUARD_FUZZ_RUNS=1000 GUARD_FUZZ_SEED=1 GUARD_FUZZ_OUT="mutant-$1.md" node tests/guard/fuzz.ts
            code=$?
            set -e
            if [ "$code" -ne 1 ]; then echo "::error::the fuzzer did not catch mutant $1 (exit $code)"; return 1; fi
            echo "mutant $1 caught"
          }
          mutant m1 'if arrived < p.min_out {' 'if false && arrived < p.min_out {'
          mutant m2 'if out.owner != policy.owner || out.mint' 'if out.mint'

      - name: The report
        if: always()
        run: cat tests/guard/results/*.md || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: guard-report
          path: |
            tests/guard/results/
            programs/guard/target/deploy/orientim_guard.so
          if-no-files-found: ignore
