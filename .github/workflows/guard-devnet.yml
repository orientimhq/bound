name: Guard on devnet

# Orientim Guard end to end on Solana's devnet (tests/guard/devnet.ts). A devnet-only deployer key is kept in the Actions cache;
# it gets devnet SOL from the faucet (or by hand from faucet.solana.com), deploys the Guard and the test swap program, runs the owner's set-up,
# the verifier and the agent's swaps over a real RPC node, then closes both programs so the SOL comes
# back. No real funds; nothing persists.
#
# It uses the secret CANARY_RPC_URL (a Helius mainnet URL), turned into Helius's devnet URL; the key
# never appears in the logs.
on:
  push:
    branches: [guard-poc]
    paths:
      - 'tests/guard/devnet.ts'
      - '.github/workflows/guard-devnet.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  devnet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 23 September 2026
      - name: Install the Solana toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - id: solana
        run: echo "version=$(solana --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache the SBF platform tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/solana
          key: platform-tools-${{ runner.os }}-${{ steps.solana.outputs.version }}
      - name: Build the Guard and the test swap program
        run: |
          (cd programs/guard && cargo build-sbf -- --locked)
          (cd tests/guard/attacker && cargo build-sbf)
          ls -l programs/guard/target/deploy/*.so tests/guard/attacker/target/deploy/*.so

      - name: The deployer key kept between runs (devnet only, never real funds)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.devnet-deployer
          key: devnet-deployer-v1
      - name: The devnet RPC and the deployer
        env:
          CANARY_RPC_URL: ${{ secrets.CANARY_RPC_URL }}
        run: |
          url="${CANARY_RPC_URL/mainnet/devnet}"
          echo "::add-mask::$url"
          echo "RPC_URL=$url" >> "$GITHUB_ENV"
          mkdir -p ~/.devnet-deployer
          [ -f ~/.devnet-deployer/key.json ] || solana-keygen new --no-bip39-passphrase --silent -o ~/.devnet-deployer/key.json
          echo "PAYER_KEYPAIR=$HOME/.devnet-deployer/key.json" >> "$GITHUB_ENV"
          echo "DEPLOYER=$(solana-keygen pubkey ~/.devnet-deployer/key.json)" >> "$GITHUB_ENV"
      - name: Keep the deployer key for the next run
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~/.devnet-deployer
          key: devnet-deployer-v1

      # The public faucet often refuses machines in the cloud. When it does, the deployer's address is
      # printed: send it devnet SOL from https://faucet.solana.com and run the workflow again.
      - name: Devnet SOL
        run: |
          need=5
          echo "deployer: $DEPLOYER"
          for i in 1 2 3 4 5 6; do
            have=$(solana balance -u "$RPC_URL" "$DEPLOYER" | awk '{print int($1)}')
            if [ "$have" -ge "$need" ]; then echo "balance: $have SOL"; exit 0; fi
            for url in "$RPC_URL" https://api.devnet.solana.com; do
              solana airdrop 2 "$DEPLOYER" -u "$url" > /dev/null 2>&1 && break
            done
            sleep 5
          done
          have=$(solana balance -u "$RPC_URL" "$DEPLOYER")
          echo "::error::the deployer $DEPLOYER has $have and needs $need SOL; the faucet refused this machine. Send devnet SOL to $DEPLOYER from https://faucet.solana.com and run again."
          echo "Deployer \`$DEPLOYER\` has $have, needs $need devnet SOL: fund it at https://faucet.solana.com and run again." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Deploy both programs
        run: |
          solana program deploy -u "$RPC_URL" -k "$PAYER_KEYPAIR" programs/guard/target/deploy/orientim_guard.so \
            --program-id programs/guard/target/deploy/orientim_guard-keypair.json
          solana program deploy -u "$RPC_URL" -k "$PAYER_KEYPAIR" tests/guard/attacker/target/deploy/orientim_attacker.so \
            --program-id tests/guard/attacker/target/deploy/orientim_attacker-keypair.json
          echo "GUARD_PROGRAM=$(solana-keygen pubkey programs/guard/target/deploy/orientim_guard-keypair.json)" >> "$GITHUB_ENV"
          echo "SWAP_PROGRAM=$(solana-keygen pubkey tests/guard/attacker/target/deploy/orientim_attacker-keypair.json)" >> "$GITHUB_ENV"

      - name: End to end on devnet
        run: node tests/guard/devnet.ts

      - name: Close both programs (the SOL comes back)
        if: always()
        run: |
          for id in "${GUARD_PROGRAM:-}" "${SWAP_PROGRAM:-}"; do
            [ -n "$id" ] && solana program close "$id" -u "$RPC_URL" -k "$PAYER_KEYPAIR" --bypass-warning || true
          done

      - name: The report
        if: always()
        run: cat tests/guard/results/devnet.md >> "$GITHUB_STEP_SUMMARY" || true
