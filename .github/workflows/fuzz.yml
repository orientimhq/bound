name: Fuzz

# Millions of generated cases, in parallel shards, each with a seed of its own. They cover:
# - the swap at any tolerance;
# - agents and bots end to end, against honest and lying servers, with any tolerance and price impact,
#   with the agent's own routes or Orientim's;
# - the current flow end to end: own routes in rounds, the fee on the input or output, an agent's
#   Jupiter far below the market (Orientim's routes instead), and who sends;
# - the small functions every channel leans on;
# - the owner's limits for agents and bots, the 20% floor, and a bot that edits prepare's answer;
# - the owner's ceilings on tolerance, floor and price impact, "auto" tolerance, and the archive's
#   proof of expiry, for agents and bots alike;
# - what a wallet hands back: a changed message passes only as Lighthouse assertions added;
# - a hostile swap program running random plans in a real Solana VM (litesvm), 400,000 cases;
# - many clients through one API key: bursts of up to 150 swaps in the same second, and 100,000
#   cases of up to four clients swapping at once, each with rules of its own;
# - one instance (Fly) restarted at any point between prepare and finalize;
# - the Pump.fun curve route Orientim builds without Jupiter, on any curve, fees and amount.
# - the published verifier (@orientimhq/swap, the version package.json pins) against transactions this
#   repository's builder makes: honest swaps, mutations, the tolerance rule, the edges, Token-2022 and
#   every pair (packages/builder/test/verifier).
#
# By hand only (Actions, Fuzz, Run workflow), before a release: a run is some 1,000 billed minutes,
# half of a private repository's free month. CI runs the same properties at their normal size on
# every change to the code.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.of }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
