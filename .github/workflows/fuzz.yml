          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      # The verifier's suites are in @orientimhq/swap's own repository: run there, at the version
      # package.json pins, so the code fuzzed is the code the server runs.
      - name: The pinned version of @orientimhq/swap
        if: startsWith(matrix.file, 'public/')
        id: pinned
        run: echo "ref=v$(node -p "require('./package.json').dependencies['@orientimhq/swap']")" >> "$GITHUB_OUTPUT"
      - if: startsWith(matrix.file, 'public/')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: orientimhq/orientim-protected-swap
          ref: ${{ steps.pinned.outputs.ref }}
          path: public
      - if: startsWith(matrix.file, 'public/')
        run: npm ci --ignore-scripts
        working-directory: public
      - name: Fuzz
        env:
          ORIENTIM_FUZZ_RUNS: ${{ matrix.runs }}
          SHARD: ${{ matrix.shard }}
          FILE: ${{ matrix.file }}
          FILTER: ${{ matrix.filter }}
        run: |
          # One seed per run and shard, printed so that any failure can be replayed exactly.
          export ORIENTIM_FUZZ_SEED=$(( GITHUB_RUN_NUMBER * 1000 + SHARD ))
          echo "seed $ORIENTIM_FUZZ_SEED, $ORIENTIM_FUZZ_RUNS cases, $FILE ${FILTER:+(\"$FILTER\")}"
          started=$(date +%s)
          vitest="$GITHUB_WORKSPACE/node_modules/vitest/vitest.mjs"
          if [ "${FILE#public/}" != "$FILE" ]; then cd public; FILE=${FILE#public/}; vitest="$PWD/node_modules/vitest/vitest.mjs"; fi
          set +e
          if [ -n "$FILTER" ]; then node "$vitest" run "$FILE" --mode fuzz -t "$FILTER"; else node "$vitest" run "$FILE" --mode fuzz; fi
          status=$?
          set -e
          took=$(( $(date +%s) - started ))
          result=$([ $status -eq 0 ] && echo "passed" || echo "FAILED")
          {
            echo "### ${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.of }}: $result"
            echo ""
            echo "- proves: ${{ matrix.proves }}"
            echo "- cases: $ORIENTIM_FUZZ_RUNS per property, seed $ORIENTIM_FUZZ_SEED"
            echo "- time: $(( took / 60 )) min $(( took % 60 )) s"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

  # T6 fuzzed: the malicious swap program runs random plans inside the protected transaction in a
  # real Solana VM (litesvm), and the promise is checked on the chain's own balances.
  cpi:
    name: hostile program ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --ignore-scripts litesvm@1.4.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 23 September 2026
      - name: Install the Solana toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      # The installed version keys the platform-tools cache, so tools from another release are never reused.
      - id: solana
        run: |
          solana --version
          echo "version=$(solana --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache the SBF platform tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/solana
          key: platform-tools-${{ runner.os }}-${{ steps.solana.outputs.version }}
      - name: Build the malicious program
        working-directory: tests/cpi/attacker
        run: cargo build-sbf
      - name: Fuzz
        env:
          ORIENTIM_FUZZ_RUNS: 200000
          SHARD: ${{ matrix.shard }}
        run: |
          export ORIENTIM_FUZZ_SEED=$(( GITHUB_RUN_NUMBER * 1000 + 900 + SHARD ))
          set +e
          node tests/cpi/fuzz.ts
          status=$?
          set -e
          cat tests/cpi/results/cpi-fuzz.md >> "$GITHUB_STEP_SUMMARY" || true
          exit $status
