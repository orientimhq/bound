name: Monitor

# Is production up, on tested code, and serving the skill its source says? tools/monitor.ts asks
# /api/health (three tries, 20 s apart, before an outage is called one), /api/status (the commit it
# was built from, the skill it serves), and checks that commit is on main, that its CI passed, and
# that /skill/SHA256SUMS is the repository's at that commit. A failed run makes GitHub tell the
# owner of this workflow. On by default, every thirty minutes (within GitHub's free minutes on a private repository): the
# repository variable ORIENTIM_MONITOR set to 0 turns it off, and ORIENTIM_SITE_URL names another
# site than https://orientim.com. GitHub pauses a schedule after 60 days without a commit.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  monitor:
    if: (vars.ORIENTIM_MONITOR || 'on') != '0' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: node tools/monitor.ts --site "${{ vars.ORIENTIM_SITE_URL || 'https://orientim.com' }}"
        env:
          GH_TOKEN: ${{ github.token }}
