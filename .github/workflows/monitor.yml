name: Monitor

# Is production up, on tested code, and pointing to a package npm says its release built? tools/monitor.ts
# asks /api/health (three tries, 20 s apart, before an outage is called one), /api/status (the commit it
# was built from, the version of @orientimhq/swap it names), and checks that commit is on main, that
# its CI passed, and that the version is on npm with the release workflow's provenance. A failed run makes GitHub tell the
# owner of this workflow. On by default, every two hours (within GitHub's free minutes on a private repository): the
# repository variable ORIENTIM_MONITOR set to 0 turns it off, and ORIENTIM_SITE_URL names another
# site than https://orientim.com. GitHub pauses a schedule after 60 days without a commit.
on:
  schedule:
    - cron: '7 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  monitor:
    if: (vars.ORIENTIM_MONITOR || 'on') != '0' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node tools/monitor.ts --site "$SITE"
        env:
          SITE: ${{ vars.ORIENTIM_SITE_URL || 'https://orientim.com' }}
          GH_TOKEN: ${{ github.token }}
